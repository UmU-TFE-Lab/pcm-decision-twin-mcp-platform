name: software-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit
      - run: npm run test:fixture
      - run: npm run build
      - run: npm test
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm run test:services
      - run: npm run mcp:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
