name: pcm-decision-twin

services:
  mcp-gateway:
    build:
      context: .
      dockerfile: mcp_gateway/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      MCP_GATEWAY_HOST: 0.0.0.0
      MCP_GATEWAY_PORT: 8787
      MCP_GATEWAY_CORS_ORIGINS: https://${PUBLIC_DOMAIN}
      MCP_GATEWAY_MAX_ACTIVE_RUNS: ${MCP_GATEWAY_MAX_ACTIVE_RUNS:-2}
      MCP_GATEWAY_RATE_LIMIT_WINDOW_MS: ${MCP_GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}
      MCP_GATEWAY_RATE_LIMIT_MAX_RUNS: ${MCP_GATEWAY_RATE_LIMIT_MAX_RUNS:-6}
      PCM_DATASET_PATH: /app/pcm_thermal_storage.csv
    expose:
      - "8787"
    volumes:
      - mcp-runs:/app/.runtime/mcp-runs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /gateway
        VITE_MCP_GATEWAY_URL: /gateway
    restart: unless-stopped
    depends_on:
      mcp-gateway:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mcp-runs:
  caddy-data:
  caddy-config:

