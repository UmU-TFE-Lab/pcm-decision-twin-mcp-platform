name: pcm-decision-twin

services:
  mcp-gateway:
    build:
      context: .
      dockerfile: mcp_gateway/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      MCP_GATEWAY_HOST: 0.0.0.0
      MCP_GATEWAY_PORT: 8787
      MCP_GATEWAY_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080},http://localhost:8080
      PCM_DATASET_PATH: /app/pcm_thermal_storage.csv
    expose:
      - "8787"
    volumes:
      - mcp-runs:/app/.runtime/mcp-runs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /gateway
        VITE_MCP_GATEWAY_URL: /gateway
    restart: unless-stopped
    depends_on:
      mcp-gateway:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mcp-runs:

