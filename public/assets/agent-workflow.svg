<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">PCM agent workflow</title>
  <desc id="desc">A clean workflow diagram for scenario validation, evidence audit, sensitivity analysis, optimization, and report generation.</desc>
  <rect width="960" height="520" rx="24" fill="#f6f8f7"/>
  <rect x="38" y="42" width="884" height="436" rx="18" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="72" y="92" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">PCM MCP Workflow</text>
  <text x="72" y="124" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="16">Auditable decision process exposed through Agent Lab and MCP tools</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(74 190)">
      <rect width="132" height="92" rx="12" fill="#dff3f0" stroke="#a8d9d4"/>
      <text x="66" y="38" text-anchor="middle" fill="#0b7f79" font-size="15" font-weight="800">Validate</text>
      <text x="66" y="62" text-anchor="middle" fill="#35514e" font-size="12">support range</text>
    </g>
    <g transform="translate(246 190)">
      <rect width="132" height="92" rx="12" fill="#fff0d6" stroke="#f0d6a7"/>
      <text x="66" y="38" text-anchor="middle" fill="#b97012" font-size="15" font-weight="800">Predict</text>
      <text x="66" y="62" text-anchor="middle" fill="#5e4b25" font-size="12">nearby records</text>
    </g>
    <g transform="translate(418 190)">
      <rect width="132" height="92" rx="12" fill="#f6f8f7" stroke="#dfe7e4"/>
      <text x="66" y="38" text-anchor="middle" fill="#17211f" font-size="15" font-weight="800">Scan</text>
      <text x="66" y="62" text-anchor="middle" fill="#65716f" font-size="12">what-if drivers</text>
    </g>
    <g transform="translate(590 190)">
      <rect width="132" height="92" rx="12" fill="#fde8ec" stroke="#efc7cf"/>
      <text x="66" y="38" text-anchor="middle" fill="#b34a5a" font-size="15" font-weight="800">Optimize</text>
      <text x="66" y="62" text-anchor="middle" fill="#69333d" font-size="12">rank designs</text>
    </g>
    <g transform="translate(762 190)">
      <rect width="132" height="92" rx="12" fill="#17211f" stroke="#17211f"/>
      <text x="66" y="38" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">Report</text>
      <text x="66" y="62" text-anchor="middle" fill="#aac1bd" font-size="12">JSON + MD</text>
    </g>
    <g stroke="#aab8b5" stroke-width="3" stroke-linecap="round">
      <line x1="216" y1="236" x2="236" y2="236"/>
      <line x1="388" y1="236" x2="408" y2="236"/>
      <line x1="560" y1="236" x2="580" y2="236"/>
      <line x1="732" y1="236" x2="752" y2="236"/>
    </g>
    <g transform="translate(74 350)">
      <rect width="820" height="58" rx="12" fill="#f6f8f7" stroke="#dfe7e4"/>
      <circle cx="36" cy="29" r="10" fill="#0b7f79"/>
      <text x="58" y="24" fill="#17211f" font-size="14" font-weight="800">Evidence trace</text>
      <text x="58" y="43" fill="#65716f" font-size="12">Every result keeps support scores, nearby records, weights, risk map, and reproducible package metadata.</text>
    </g>
  </g>
</svg>
