<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Cloud architecture blueprint</title>
  <desc id="desc">Cloud-ready architecture with frontend, API, database, storage, model service, and MCP server.</desc>
  <rect width="960" height="520" rx="24" fill="#f6f8f7"/>
  <rect x="42" y="42" width="876" height="436" rx="18" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="76" y="92" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Cloud Deployment Blueprint</text>
  <text x="76" y="124" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="16">Production path for the PCM decision twin and agent API</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(76 184)">
      <rect width="164" height="78" rx="12" fill="#dff3f0" stroke="#a8d9d4"/>
      <text x="82" y="34" text-anchor="middle" fill="#0b7f79" font-size="15" font-weight="800">Frontend</text>
      <text x="82" y="56" text-anchor="middle" fill="#35514e" font-size="12">Vercel / Netlify</text>
    </g>
    <g transform="translate(306 184)">
      <rect width="164" height="78" rx="12" fill="#fff0d6" stroke="#f0d6a7"/>
      <text x="82" y="34" text-anchor="middle" fill="#b97012" font-size="15" font-weight="800">Backend API</text>
      <text x="82" y="56" text-anchor="middle" fill="#5e4b25" font-size="12">FastAPI / Node</text>
    </g>
    <g transform="translate(536 184)">
      <rect width="164" height="78" rx="12" fill="#f6f8f7" stroke="#dfe7e4"/>
      <text x="82" y="34" text-anchor="middle" fill="#17211f" font-size="15" font-weight="800">Model Service</text>
      <text x="82" y="56" text-anchor="middle" fill="#65716f" font-size="12">Estimator + ML</text>
    </g>
    <g transform="translate(736 184)">
      <rect width="124" height="78" rx="12" fill="#fde8ec" stroke="#efc7cf"/>
      <text x="62" y="34" text-anchor="middle" fill="#b34a5a" font-size="15" font-weight="800">MCP</text>
      <text x="62" y="56" text-anchor="middle" fill="#69333d" font-size="12">Agent API</text>
    </g>
    <g transform="translate(306 328)">
      <rect width="164" height="72" rx="12" fill="#17211f"/>
      <text x="82" y="31" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">PostgreSQL</text>
      <text x="82" y="52" text-anchor="middle" fill="#aac1bd" font-size="12">Scenarios + logs</text>
    </g>
    <g transform="translate(536 328)">
      <rect width="164" height="72" rx="12" fill="#22312e"/>
      <text x="82" y="31" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">S3 Storage</text>
      <text x="82" y="52" text-anchor="middle" fill="#aac1bd" font-size="12">CSV + artifacts</text>
    </g>
    <g stroke="#aab8b5" stroke-width="3" stroke-linecap="round">
      <line x1="250" y1="223" x2="296" y2="223"/>
      <line x1="480" y1="223" x2="526" y2="223"/>
      <line x1="710" y1="223" x2="726" y2="223"/>
      <line x1="388" y1="272" x2="388" y2="318"/>
      <line x1="618" y1="272" x2="618" y2="318"/>
    </g>
  </g>
</svg>
