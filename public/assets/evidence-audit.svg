<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Evidence audit visualization</title>
  <desc id="desc">Nearest evidence records plotted by distance and weight for PCM decision audit.</desc>
  <rect width="960" height="520" rx="24" fill="#f6f8f7"/>
  <rect x="44" y="44" width="872" height="432" rx="18" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="78" y="96" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Evidence Audit</text>
  <text x="78" y="126" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="16">Nearest records explain why a PCM state estimate is trusted or flagged</text>
  <g transform="translate(96 172)">
    <line x1="0" y1="250" x2="720" y2="250" stroke="#dfe7e4" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#dfe7e4" stroke-width="2"/>
    <text x="346" y="292" text-anchor="middle" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="13">Normalized distance</text>
    <text x="-70" y="126" text-anchor="middle" transform="rotate(-90 -70 126)" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="13">Evidence rank</text>
    <g font-family="Inter, Arial, sans-serif" font-size="12">
      <circle cx="92" cy="44" r="30" fill="#0b7f79" opacity="0.86" stroke="#ffffff" stroke-width="3"/>
      <text x="92" y="49" text-anchor="middle" fill="#ffffff" font-weight="800">#1</text>
      <circle cx="172" cy="94" r="24" fill="#0b7f79" opacity="0.72" stroke="#ffffff" stroke-width="3"/>
      <text x="172" y="99" text-anchor="middle" fill="#ffffff" font-weight="800">#2</text>
      <circle cx="280" cy="132" r="20" fill="#b97012" opacity="0.78" stroke="#ffffff" stroke-width="3"/>
      <text x="280" y="137" text-anchor="middle" fill="#ffffff" font-weight="800">#3</text>
      <circle cx="410" cy="176" r="16" fill="#b97012" opacity="0.7" stroke="#ffffff" stroke-width="3"/>
      <text x="410" y="181" text-anchor="middle" fill="#ffffff" font-weight="800">#4</text>
      <circle cx="568" cy="214" r="15" fill="#b34a5a" opacity="0.74" stroke="#ffffff" stroke-width="3"/>
      <text x="568" y="219" text-anchor="middle" fill="#ffffff" font-weight="800">#5</text>
    </g>
    <g transform="translate(535 18)" font-family="Inter, Arial, sans-serif">
      <rect width="214" height="100" rx="12" fill="#f6f8f7" stroke="#dfe7e4"/>
      <circle cx="22" cy="28" r="7" fill="#0b7f79"/>
      <text x="40" y="33" fill="#35514e" font-size="12">high efficiency evidence</text>
      <circle cx="22" cy="54" r="7" fill="#b97012"/>
      <text x="40" y="59" fill="#5e4b25" font-size="12">SOC-driven evidence</text>
      <circle cx="22" cy="80" r="7" fill="#b34a5a"/>
      <text x="40" y="85" fill="#69333d" font-size="12">high-loss evidence</text>
    </g>
  </g>
</svg>
