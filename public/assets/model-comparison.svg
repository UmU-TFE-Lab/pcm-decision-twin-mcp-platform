<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Model comparison</title>
  <desc id="desc">Comparison of global mean, category mean, similarity estimator, and future machine learning model service.</desc>
  <rect width="960" height="520" rx="24" fill="#f6f8f7"/>
  <rect x="42" y="42" width="876" height="436" rx="18" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="76" y="92" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Model Comparison</text>
  <text x="76" y="124" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="16">The active estimator prioritizes auditability while future model services can add predictive power</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(76 190)">
      <rect width="184" height="172" rx="14" fill="#f6f8f7" stroke="#dfe7e4"/>
      <text x="92" y="38" text-anchor="middle" fill="#17211f" font-size="16" font-weight="800">Global mean</text>
      <text x="92" y="74" text-anchor="middle" fill="#65716f" font-size="12">baseline</text>
      <text x="92" y="102" text-anchor="middle" fill="#65716f" font-size="12">low detail</text>
      <text x="92" y="130" text-anchor="middle" fill="#65716f" font-size="12">no evidence trace</text>
    </g>
    <g transform="translate(286 190)">
      <rect width="184" height="172" rx="14" fill="#fff0d6" stroke="#f0d6a7"/>
      <text x="92" y="38" text-anchor="middle" fill="#b97012" font-size="16" font-weight="800">Category mean</text>
      <text x="92" y="74" text-anchor="middle" fill="#5e4b25" font-size="12">baseline</text>
      <text x="92" y="102" text-anchor="middle" fill="#5e4b25" font-size="12">category support</text>
      <text x="92" y="130" text-anchor="middle" fill="#5e4b25" font-size="12">medium detail</text>
    </g>
    <g transform="translate(496 170)">
      <rect width="184" height="212" rx="14" fill="#dff3f0" stroke="#a8d9d4" stroke-width="2"/>
      <text x="92" y="44" text-anchor="middle" fill="#0b7f79" font-size="16" font-weight="800">Similarity estimator</text>
      <text x="92" y="84" text-anchor="middle" fill="#35514e" font-size="12">active model</text>
      <text x="92" y="112" text-anchor="middle" fill="#35514e" font-size="12">nearest evidence</text>
      <text x="92" y="140" text-anchor="middle" fill="#35514e" font-size="12">weights + distance</text>
      <text x="92" y="168" text-anchor="middle" fill="#35514e" font-size="12">high auditability</text>
    </g>
    <g transform="translate(706 190)">
      <rect width="184" height="172" rx="14" fill="#fde8ec" stroke="#efc7cf"/>
      <text x="92" y="38" text-anchor="middle" fill="#b34a5a" font-size="16" font-weight="800">RF / XGB / MLP</text>
      <text x="92" y="74" text-anchor="middle" fill="#69333d" font-size="12">future service</text>
      <text x="92" y="102" text-anchor="middle" fill="#69333d" font-size="12">higher capacity</text>
      <text x="92" y="130" text-anchor="middle" fill="#69333d" font-size="12">needs validation</text>
    </g>
  </g>
</svg>
