<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Scenario quality score decomposition</title>
  <desc id="desc">Score and penalty components behind scenario support.</desc>
  <rect width="960" height="520" rx="24" fill="#f6f8f7"/>
  <rect x="42" y="42" width="876" height="436" rx="18" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="76" y="92" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Scenario Quality Decomposition</text>
  <text x="76" y="124" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="16">Scenario support combines data components and documented penalties</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <g transform="translate(120 188)">
      <text x="0" y="-20" fill="#17211f" font-size="15" font-weight="800">Positive support</text>
      <rect x="0" y="0" width="170" height="38" rx="8" fill="#dff3f0"/><text x="14" y="24" fill="#0b7f79" font-weight="800">Category support</text>
      <rect x="184" y="0" width="170" height="38" rx="8" fill="#dff3f0"/><text x="198" y="24" fill="#0b7f79" font-weight="800">Numeric range</text>
      <rect x="368" y="0" width="170" height="38" rx="8" fill="#dff3f0"/><text x="382" y="24" fill="#0b7f79" font-weight="800">Evidence level</text>
      <rect x="552" y="0" width="170" height="38" rx="8" fill="#dff3f0"/><text x="566" y="24" fill="#0b7f79" font-weight="800">Sample size</text>
    </g>
    <g transform="translate(230 298)">
      <text x="0" y="-20" fill="#17211f" font-size="15" font-weight="800">Penalties</text>
      <rect x="0" y="0" width="210" height="38" rx="8" fill="#fde8ec"/><text x="14" y="24" fill="#b34a5a" font-weight="800">Extension penalty</text>
      <rect x="236" y="0" width="210" height="38" rx="8" fill="#fde8ec"/><text x="250" y="24" fill="#b34a5a" font-weight="800">Warning penalty</text>
    </g>
    <g transform="translate(230 392)">
      <rect width="500" height="22" rx="11" fill="#dfe7e4"/>
      <rect width="365" height="22" rx="11" fill="#0b7f79"/>
      <rect x="365" width="72" height="22" rx="11" fill="#b97012"/>
      <text x="250" y="54" text-anchor="middle" fill="#65716f">Final scenario-support score after documented penalties</text>
    </g>
  </g>
</svg>
