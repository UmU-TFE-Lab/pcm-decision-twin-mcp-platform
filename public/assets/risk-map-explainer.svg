<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Decision risk map explainer</title>
  <desc id="desc">Risk map dimensions used by the PCM Agent Lab.</desc>
  <rect width="960" height="520" rx="24" fill="#f6f8f7"/>
  <rect x="42" y="42" width="876" height="436" rx="18" fill="#ffffff" stroke="#dfe7e4" stroke-width="2"/>
  <text x="76" y="92" fill="#17211f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Decision Risk Map</text>
  <text x="76" y="124" fill="#65716f" font-family="Inter, Arial, sans-serif" font-size="16">Six risk dimensions summarize whether a recommendation is trustworthy and actionable</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(82 178)">
      <rect width="236" height="92" rx="12" fill="#dff3f0" stroke="#a8d9d4"/>
      <text x="24" y="34" fill="#0b7f79" font-size="15" font-weight="800">Data support</text>
      <text x="24" y="58" fill="#35514e" font-size="12">scenario support + exact records</text>
    </g>
    <g transform="translate(362 178)">
      <rect width="236" height="92" rx="12" fill="#fff0d6" stroke="#f0d6a7"/>
      <text x="24" y="34" fill="#b97012" font-size="15" font-weight="800">Extrapolation</text>
      <text x="24" y="58" fill="#5e4b25" font-size="12">range + category warnings</text>
    </g>
    <g transform="translate(642 178)">
      <rect width="236" height="92" rx="12" fill="#fde8ec" stroke="#efc7cf"/>
      <text x="24" y="34" fill="#b34a5a" font-size="15" font-weight="800">Saturation</text>
      <text x="24" y="58" fill="#69333d" font-size="12">98% cap + 35% floor</text>
    </g>
    <g transform="translate(82 306)">
      <rect width="236" height="92" rx="12" fill="#fff0d6" stroke="#f0d6a7"/>
      <text x="24" y="34" fill="#b97012" font-size="15" font-weight="800">Low SOC</text>
      <text x="24" y="58" fill="#5e4b25" font-size="12">predicted charge reserve</text>
    </g>
    <g transform="translate(362 306)">
      <rect width="236" height="92" rx="12" fill="#fde8ec" stroke="#efc7cf"/>
      <text x="24" y="34" fill="#b34a5a" font-size="15" font-weight="800">High loss</text>
      <text x="24" y="58" fill="#69333d" font-size="12">thermal loss penalty</text>
    </g>
    <g transform="translate(642 306)">
      <rect width="236" height="92" rx="12" fill="#dff3f0" stroke="#a8d9d4"/>
      <text x="24" y="34" fill="#0b7f79" font-size="15" font-weight="800">Degradation</text>
      <text x="24" y="58" fill="#35514e" font-size="12">health index + cycling</text>
    </g>
    <g transform="translate(300 430)">
      <circle cx="0" cy="0" r="7" fill="#0b7f79"/><text x="16" y="5" fill="#65716f" font-size="12">Low</text>
      <circle cx="92" cy="0" r="7" fill="#b97012"/><text x="108" y="5" fill="#65716f" font-size="12">Medium</text>
      <circle cx="220" cy="0" r="7" fill="#b34a5a"/><text x="236" y="5" fill="#65716f" font-size="12">High</text>
    </g>
  </g>
</svg>
